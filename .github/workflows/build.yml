name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tree-sitter ref to build (tag / branch / sha)"
        required: true
        default: "master"
  workflow_call:
    inputs:
      ref:
        description: "tree-sitter ref to build"
        required: false
        default: "master"
        type: string

permissions:
  contents: write

jobs:
  build:
    # manylinux2014 (glibc 2.17) supports these arches (see Dockerfile).
    #   x86_64  : 64-bit Intel/AMD
    #   i686    : 32-bit Intel/AMD
    #   aarch64 : 64-bit ARM (AWS Graviton, Raspberry Pi 4, ...)
    # (armv7l is excluded — pypa publishes no manylinux2014_armv7l image.)
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, i686, aarch64]
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout this repo (Dockerfile)
        uses: actions/checkout@v4

      - name: Set up QEMU for foreign-arch builds (aarch64)
        uses: docker/setup-qemu-action@v3

      - name: Build tree-sitter in manylinux2014 (glibc 2.17)
        # Build lives entirely in the Dockerfile; the host only runs docker
        # (the runner's node/gh need a newer glibc than 2.17).
        env:
          REF: ${{ github.event.inputs.ref || inputs.ref || 'master' }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Map the manylinux arch to the Rust host target triple.
          case "${ARCH}" in
            x86_64|i686|aarch64) RUST="${ARCH}-unknown-linux-gnu" ;;
            *) echo "unsupported arch: ${ARCH}"; exit 1 ;;
          esac
          # quickjs (qjs-rt) can't compile for 32-bit i686; build without it there.
          SKIP_QJS=0
          [ "${ARCH}" = "i686" ] && SKIP_QJS=1
          docker build -t "tree-sitter-builder-${ARCH}" \
            --build-arg "REF=${REF}" \
            --build-arg "TARGET_ARCH=${ARCH}" \
            --build-arg "RUST_TARGET=${RUST}" \
            --build-arg "SKIP_QJS=${SKIP_QJS}" .
          CID="$(docker create "tree-sitter-builder-${ARCH}")"
          docker cp "${CID}:/tree-sitter" "${{ runner.temp }}/tree-sitter"
          docker rm "${CID}"

      - name: Package
        run: |
          gzip -9 -c "${{ runner.temp }}/tree-sitter" \
            > "${{ runner.temp }}/tree-sitter-linux-${{ matrix.arch }}.gz"
          ls -lh "${{ runner.temp }}/tree-sitter-linux-${{ matrix.arch }}.gz"

      - name: Verify glibc requirement
        run: |
          echo "==> ELF interpreter"
          readelf -l "${{ runner.temp }}/tree-sitter" | grep -i interpreter || true
          echo "==> Highest GLIBC symbol version needed"
          objdump -T "${{ runner.temp }}/tree-sitter" 2>/dev/null \
            | grep -oE 'GLIBC_[0-9.]+' | sort -V -u || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-${{ matrix.arch }}
          path: ${{ runner.temp }}/tree-sitter-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout this repo (for tag pushes)
        uses: actions/checkout@v4

      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine build mode
        id: meta
        env:
          REF: ${{ github.event.inputs.ref || inputs.ref || 'master' }}
        run: |
          REF="${REF}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          # Versioned release if ref looks like a semver tag (v0.25.10 / 0.25.10)
          if echo "${REF}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            VER="${REF#v}"
            echo "mode=versioned" >> "$GITHUB_OUTPUT"
            echo "tag=v${VER}"     >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            DATE="$(date -u +%Y%m%d)"
            RESP="$(curl -fsSL --retry 5 --retry-all-errors \
                     "https://api.github.com/repos/tree-sitter/tree-sitter/commits/${REF}")"
            SHA="$(printf '%s' "${RESP}" | grep -m1 '"sha"' | sed -E 's/.*"sha": *"([0-9a-f]+)".*/\1/' | cut -c1-10)"
            echo "mode=nightly" >> "$GITHUB_OUTPUT"
            echo "tag=nightly"  >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "nightly_date=${DATE}" >> "$GITHUB_OUTPUT"
            echo "nightly_sha=${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release
        if: steps.meta.outputs.mode == 'versioned'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" dist/*.gz \
            --title "${TAG}" \
            --notes "Prebuilt tree-sitter CLI (manylinux2014, glibc >= 2.17): x86_64, i686, aarch64. Source: tree-sitter/tree-sitter @ ${TAG}."

      - name: Publish / roll nightly prerelease
        if: steps.meta.outputs.mode == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: nightly
          DATE: ${{ steps.meta.outputs.nightly_date }}
          SHA: ${{ steps.meta.outputs.nightly_sha }}
        run: |
          git tag -f "${TAG}"
          git push -f origin "${TAG}"
          gh release delete "${TAG}" --yes || true
          gh release create "${TAG}" dist/*.gz \
            --title "nightly ${DATE} (${SHA})" \
            --prerelease \
            --notes "Nightly prerelease build (manylinux2014, glibc >= 2.17): x86_64, i686, aarch64. Source: tree-sitter/tree-sitter @ ${SHA}."
